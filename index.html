<style>
    :root {
      /* تم اصفهان: فیروزه، طلا، لاجورد، کرم */
      --turquoise: #2ec4b6;
      --turquoise-deep: #0f766e;
      --lapis: #0b3d5c;
      --night: #062a32;
      --gold: #e2b657;
      --gold-deep: #c4922a;
      --cream: #f7f0e3;
      --melt: var(--gold);
      --forge: var(--night);
      --accent: var(--turquoise);
      --font: "Graphik Arabic", Tahoma, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--night);
      color: var(--cream);
      min-height: 100vh;
      font-weight: 400;
      position: relative;
      isolation: isolate;
    }
    a { color: inherit; text-decoration: none; }

    /* بک‌گراند یک‌دست و سراسری */
    .page-atmosphere {
      position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    }
    .page-atmosphere .page-base {
      position: absolute; inset: 0;
      background: linear-gradient(165deg, #07343e 0%, #062a32 48%, #05242c 100%);
    }
    .page-atmosphere .page-wash {
      position: absolute; inset: -12%;
      background:
        radial-gradient(ellipse 60% 48% at var(--px, 68%) var(--py, 22%), rgba(46,196,182,.18), transparent 58%),
        radial-gradient(ellipse 50% 42% at calc(100% - var(--px, 68%)) calc(85% - var(--py, 22%) * .4), rgba(226,182,87,.11), transparent 55%),
        radial-gradient(ellipse 40% 30% at 50% 100%, rgba(46,196,182,.06), transparent 60%);
    }
    .page-atmosphere .page-mesh {
      position: absolute; inset: 0; opacity: .28;
      background-image:
        linear-gradient(118deg, transparent 0 44%, rgba(46,196,182,.06) 48%, transparent 52%),
        linear-gradient(248deg, transparent 0 56%, rgba(226,182,87,.045) 60%, transparent 64%);
      animation: mesh-shift 26s ease-in-out infinite alternate;
    }
    .page-atmosphere .page-lattice {
      position: absolute; inset: 0; opacity: .14;
      background-image:
        linear-gradient(rgba(46,196,182,.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(46,196,182,.045) 1px, transparent 1px);
      background-size: 80px 80px;
      background-position: calc(var(--scroll-p, 0) * -30px) calc(var(--scroll-p, 0) * 18px);
    }
    .page-atmosphere .page-grain {
      position: absolute; inset: 0; opacity: .18; mix-blend-mode: soft-light;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }
    .page-atmosphere .page-glow {
      position: absolute; inset: 0;
      background: radial-gradient(520px circle at var(--px, 68%) var(--py, 22%), rgba(46,196,182,.16), rgba(226,182,87,.05) 34%, transparent 60%);
    }
    .page-atmosphere .page-orb {
      position: absolute; border-radius: 50%; filter: blur(42px); opacity: .32;
      animation: orb-float 14s ease-in-out infinite alternate;
    }
    .page-atmosphere .page-orb.a { width: 280px; height: 280px; background: rgba(46,196,182,.5); top: 8%; left: 6%; }
    .page-atmosphere .page-orb.b { width: 340px; height: 340px; background: rgba(226,182,87,.28); top: 42%; right: -4%; animation-delay: -4s; }
    .page-atmosphere .page-orb.c { width: 220px; height: 220px; background: rgba(46,196,182,.28); bottom: 8%; left: 38%; animation-delay: -8s; }
    .page-atmosphere .page-spark {
      position: absolute; inset: 0; width: 100%; height: 100%;
    }
    .page-atmosphere .page-mark {
      position: absolute; opacity: .4; will-change: transform;
    }
    .page-atmosphere .page-mark.arc {
      width: 180px; height: 180px; border: 1px solid rgba(46,196,182,.22);
      border-radius: 50%; border-left-color: transparent; border-bottom-color: transparent;
      top: 18%; left: 8%;
    }
    .page-atmosphere .page-mark.line {
      width: 100px; height: 1px;
      background: linear-gradient(90deg, rgba(226,182,87,.4), transparent);
      top: 32%; right: 10%;
    }
    .page-atmosphere .page-mark.dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: rgba(46,196,182,.45); box-shadow: 0 0 0 7px rgba(46,196,182,.06);
      bottom: 22%; left: 16%;
    }
    .page-atmosphere .page-rim {
      position: absolute; inset: 0;
      background:
        linear-gradient(90deg, rgba(4,30,36,.35), transparent 12%, transparent 88%, rgba(4,30,36,.3)),
        linear-gradient(180deg, rgba(6,42,50,.12), transparent 16%, transparent 84%, rgba(4,30,36,.35));
    }

    /* کادر راست و چپ — عکس اسلیمی کاربر، عمودی پر کناره و قرینه */
    .iran-motif {
      position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden;
    }
    .iran-motif-side {
      position: absolute;
      top: 0;
      bottom: 0;
      width: clamp(5rem, 10vw, 9rem);
      opacity: .2;
      background-image: url("/assets/eslimi-side.png?v=5");
      background-repeat: repeat-y;
      background-position: top center;
      background-size: 100% auto; /* عرض پر می‌شود؛ ارتفاع اصلی حفظ می‌شود */
      -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 5%, #000 95%, transparent 100%);
      mask-image: linear-gradient(180deg, transparent 0%, #000 5%, #000 95%, transparent 100%);
    }
    .iran-motif-side.start { right: 0; }
    .iran-motif-side.end { left: 0; transform: scaleX(-1); }
    @media (max-width: 720px) {
      .iran-motif-side {
        width: 3.2rem;
        opacity: .14;
      }
    }
    .ticker, #page-sections, footer, .scroll-progress { position: relative; z-index: 3; }
    #page-sections, footer, header, .ticker {
      padding-inline: clamp(1.35rem, 9vw, 6.5rem);
    }
    .ticker { z-index: 30; }
    .scroll-progress { z-index: 50; }

    header {
      position: sticky; top: 0; z-index: 40;
      display: flex; justify-content: space-between; align-items: center;
      max-width: 72rem; margin: 0 auto; padding: 1.1rem 1rem; width: 100%;
      background: rgba(6, 42, 50, .88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(46, 196, 182, .16);
    }
    .brand {
      font-size: 1.45rem; font-weight: 700; color: var(--gold);
    }
    .brand span {
      margin-right: .55rem; font-size: .7rem; color: rgba(247,240,227,.6); font-weight: 400; vertical-align: middle;
    }
    nav#siteNav {
      display: flex; flex-wrap: wrap; gap: .65rem .85rem; align-items: center; justify-content: flex-end;
    }
    .nav-link {
      position: relative; color: var(--nav-color, var(--cream));
      font-size: var(--nav-size, .9rem); font-family: var(--nav-font, var(--font));
      padding: .2rem 0; opacity: .88; transition: opacity .2s ease, color .2s ease;
    }
    .nav-link::after {
      content: ""; position: absolute; right: 0; bottom: -.12rem; height: 1px; width: 0;
      background: linear-gradient(90deg, var(--nav-color, var(--turquoise)), transparent);
      transition: width .28s ease;
    }
    .nav-link:hover { opacity: 1; }
    .nav-link:hover::after { width: 100%; }

    .btn {
      position: relative; overflow: hidden;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--gold); color: #062a32; font-weight: 600;
      border-radius: .55rem; padding: .75rem 1.35rem; border: 0; cursor: pointer;
      font-family: inherit;
      transition: background .25s ease, transform .2s ease, box-shadow .25s ease;
    }
    .btn:hover { background: #f0d08a; box-shadow: 0 10px 30px rgba(226,182,87,.22); }
    .btn-magnetic { will-change: transform; }
    .btn-magnetic span { position: relative; z-index: 1; }
    .btn-to-register {
      gap: .55rem;
      padding-inline: 1.45rem 1.25rem;
      background: linear-gradient(135deg, #e8c36a 0%, var(--gold) 45%, #c9a046 100%);
      box-shadow: 0 12px 28px rgba(226,182,87,.24), inset 0 1px 0 rgba(255,255,255,.35);
      transition: background .25s ease, box-shadow .25s ease, filter .25s ease;
    }
    .btn-to-register::after {
      content: "";
      width: .55rem; height: .55rem;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(45deg);
      opacity: .75;
      transition: transform .25s ease, opacity .25s ease;
      flex-shrink: 0;
    }
    .btn-to-register:hover::after {
      transform: rotate(45deg) translate(2px, 2px);
      opacity: 1;
    }
    .btn-to-register:active {
      filter: brightness(.97);
    }
    html { scroll-behavior: auto; }
    .ripple {
      position: absolute; border-radius: 50%;
      background: rgba(255,255,255,.45);
      transform: scale(0); animation: ripple .65s ease-out forwards;
      pointer-events: none;
    }
    .btn-nav {
      padding: .4rem .85rem; font-size: .85rem;
      background: transparent; color: var(--cream);
      border: 1px solid rgba(46,196,182,.45);
    }
    .btn-nav:hover { background: rgba(46,196,182,.12); box-shadow: none; }

    /* دکمه‌های خاص هدر */
    .nav-login {
      position: relative; overflow: hidden;
      display: inline-flex; align-items: center; gap: .45rem;
      padding: .48rem 1rem .48rem .85rem;
      border-radius: .7rem;
      border: 1px solid rgba(46,196,182,.5);
      background:
        linear-gradient(135deg, rgba(46,196,182,.14), rgba(226,182,87,.04)),
        rgba(6,42,50,.35);
      color: var(--nav-color, var(--turquoise));
      font-size: var(--nav-size, .82rem);
      font-family: var(--nav-font, var(--font));
      font-weight: 600;
      letter-spacing: .02em;
      backdrop-filter: blur(8px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 8px 22px rgba(0,0,0,.18);
      transition: transform .2s ease, border-color .25s ease, box-shadow .25s ease, background .25s ease;
    }
    .nav-login::before {
      content: ""; width: .45rem; height: .45rem; border-radius: 50%;
      background: var(--nav-color, var(--turquoise));
      box-shadow: 0 0 0 3px rgba(46,196,182,.22);
      flex-shrink: 0;
    }
    .nav-login:hover {
      transform: translateY(-1px);
      border-color: rgba(46,196,182,.85);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 12px 28px rgba(46,196,182,.18);
      background:
        linear-gradient(135deg, rgba(46,196,182,.22), rgba(226,182,87,.08)),
        rgba(6,42,50,.45);
    }

    .nav-cta {
      position: relative; overflow: hidden;
      display: inline-flex; align-items: center; justify-content: center;
      padding: .52rem 1.15rem;
      border-radius: .75rem; border: 0;
      color: var(--nav-color, #062a32);
      font-size: var(--nav-size, .82rem);
      font-family: var(--nav-font, var(--font));
      font-weight: 700;
      background:
        linear-gradient(120deg, #f0d08a 0%, var(--gold) 42%, #c4922a 100%);
      box-shadow:
        0 0 0 1px rgba(226,182,87,.35),
        0 10px 28px rgba(226,182,87,.28),
        inset 0 1px 0 rgba(255,255,255,.35);
      transition: transform .2s ease, box-shadow .25s ease, filter .25s ease;
    }
    .nav-cta::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.35) 48%, transparent 62%);
      transform: translateX(-120%);
      transition: transform .55s ease;
    }
    .nav-cta:hover {
      transform: translateY(-1px) scale(1.02);
      filter: brightness(1.05);
      box-shadow:
        0 0 0 1px rgba(226,182,87,.5),
        0 14px 34px rgba(226,182,87,.36),
        inset 0 1px 0 rgba(255,255,255,.45);
    }
    .nav-cta:hover::after { transform: translateX(120%); }
    .nav-cta span, .nav-login span { position: relative; z-index: 1; }

    .scroll-progress {
      position: fixed; top: 0; right: 0; left: 0; height: 2px; z-index: 50;
      background: rgba(255,255,255,.06);
    }
    .scroll-progress span {
      display: block; height: 100%; width: 100%; transform-origin: right center; transform: scaleX(0);
      background: linear-gradient(90deg, var(--turquoise), var(--gold));
    }

    .ticker {
      position: fixed; right: 0; left: 0; bottom: 0; z-index: 30;
      overflow: hidden; border-top: 1px solid rgba(46,196,182,.22);
      background: rgba(4,30,36,.82); backdrop-filter: blur(10px);
      direction: ltr; /* مسیر انیمیشن یکدست؛ متن‌ها خودشان RTL می‌مانند */
    }
    .ticker-track {
      display: flex;
      width: max-content;
      padding: .65rem 0;
      white-space: nowrap;
      will-change: transform;
      animation: ticker-loop var(--ticker-duration, 28s) linear infinite;
      color: rgba(247,240,227,.78); font-size: .85rem;
    }
    .ticker-group {
      display: flex;
      align-items: center;
      gap: 2.5rem;
      flex-shrink: 0;
      padding-inline-end: 2.5rem;
    }
    .ticker-track span {
      color: var(--tick-color, rgba(247,240,227,.78));
      direction: rtl;
      unicode-bidi: isolate;
    }

    .hero-bg { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .hero-bg .pointer-glow {
      position: absolute; inset: 0;
      background: radial-gradient(480px circle at var(--x, 70%) var(--y, 35%), rgba(46,196,182,.14), rgba(226,182,87,.05) 30%, transparent 58%);
    }
    .hero-bg .hairline {
      position: absolute; right: 0; left: 0; bottom: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(46,196,182,.28), rgba(226,182,87,.22), transparent);
      opacity: .7;
    }
    .hero-inner { position: relative; z-index: 2; width: 100%; }
    .hero-kicker {
      margin: 0; font-size: .8rem; letter-spacing: .08em; color: var(--turquoise); font-weight: 500;
    }
    .hero-title {
      line-height: 1.05; font-weight: 700; margin: 0; color: var(--gold);
      transform-style: preserve-3d; will-change: transform;
      text-shadow: 0 0 40px rgba(226,182,87,.12);
    }
    .hero-sub {
      margin: 0; max-width: 32rem; font-weight: 400; color: rgba(247,240,227,.78); line-height: 1.8;
    }
    .hero-cta { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; }

    section { padding: 5rem 1rem; }
    .wrap { max-width: 72rem; margin: 0 auto; }
    .features-row {
      display: flex;
      align-items: stretch;
      gap: 0;
      width: 100%;
      border-top: 1px solid rgba(226,182,87,.28);
      border-bottom: 1px solid rgba(46,196,182,.16);
      background:
        linear-gradient(180deg, rgba(226,182,87,.05), transparent 42%),
        rgba(6,42,50,.18);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }
    .feat {
      position: relative;
      flex: 1 1 0;
      min-width: min(11.5rem, 72vw);
      padding: 1.35rem 1.15rem 1.45rem;
      border: 0;
      background: transparent;
      transition: background .25s ease, color .25s ease;
    }
    .feat + .feat {
      border-right: 1px solid rgba(46,196,182,.14);
    }
    .feat::before {
      content: "";
      position: absolute; top: 0; right: 1.15rem; left: 1.15rem;
      height: 2px; width: auto;
      background: linear-gradient(90deg, var(--gold), transparent 75%);
      opacity: 0;
      transition: opacity .25s ease;
    }
    .feat:hover {
      background: rgba(46,196,182,.06);
      transform: none;
    }
    .feat:hover::before { opacity: 1; }
    .feat-head {
      display: flex;
      align-items: flex-start;
      gap: .65rem;
      margin: 0 0 .7rem;
    }
    .feat-index {
      flex: 0 0 auto;
      display: block;
      margin: .1rem 0 0;
      font-size: clamp(1.45rem, 2vw, 1.95rem);
      line-height: 1;
      font-weight: 300;
      letter-spacing: .04em;
      color: rgba(226,182,87,.42);
      transition: color .25s ease, transform .25s ease;
    }
    .feat:hover .feat-index {
      color: rgba(226,182,87,.88);
      transform: translateY(-2px);
    }
    .feat h3 {
      color: var(--cream);
      font-size: clamp(.92rem, 1.15vw, 1.05rem);
      font-weight: 600;
      margin: 0;
      line-height: 1.45;
      min-width: 0;
      flex: 1;
    }
    .feat p {
      color: rgba(247,240,227,.68);
      line-height: 1.75;
      margin: 0;
      font-weight: 400;
      font-size: .9em;
      text-align: justify;
      text-justify: inter-word;
    }
    .is-in .feat-card { animation: card-in .55s ease both; animation-delay: calc(var(--i, 0) * .07s); }
    @media (max-width: 720px) {
      .features-row { scroll-snap-type: x mandatory; }
      .feat { scroll-snap-align: start; min-width: 78vw; }
    }

    .split-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      width: 100%;
    }
    .split-row[data-image-side="right"] {
      grid-template-areas: "media copy";
    }
    .split-row[data-image-side="left"] {
      grid-template-areas: "copy media";
    }
    .split-copy { grid-area: copy; min-width: 0; }
    .split-media {
      grid-area: media;
      min-width: 0;
      overflow: hidden;
      border: 1px solid rgba(226,182,87,.22);
      background: rgba(4,30,36,.35);
      min-height: clamp(14rem, 32vw, 22rem);
    }
    .split-media img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      min-height: clamp(14rem, 32vw, 22rem);
    }
    .split-media-empty {
      display: grid; place-items: center;
      color: rgba(247,240,227,.45); font-size: .9rem;
      border-style: dashed;
    }
    @media (max-width: 800px) {
      .split-row,
      .split-row[data-image-side="right"],
      .split-row[data-image-side="left"] {
        grid-template-columns: 1fr;
        grid-template-areas:
          "media"
          "copy";
      }
      .split-media, .split-media img { min-height: 14rem; }
    }

    .blog-grid {

    <div class="page-orb b"></div>
    <div class="page-orb c"></div>
    <div class="page-mesh"></div>
    <div class="page-lattice"></div>
    <canvas class="page-spark"></canvas>
    <div class="page-grain"></div>
    <div class="page-rim"></div>
  </div>
  <div class="iran-motif" aria-hidden="true">
    <div class="iran-motif-side start"></div>
    <div class="iran-motif-side end"></div>
  </div>
  <div class="scroll-progress" aria-hidden="true"><span></span></div>
  <header>
    <a class="brand" href="/">سورناگلد<span>طلای آبشده مطمئن و شفاف با اعتبار سایناگلد</span></a>
    <nav id="siteNav" aria-label="منوی اصلی"></nav>
  </header>

  <div class="ticker" aria-hidden="true">
    <div class="ticker-track" id="tickerTrack"></div>
  </div>

  <main id="page-sections"></main>

  <footer>
    <div class="wrap" id="siteFooter"></div>
  </footer>

  <div class="lead-modal footer-info-modal" id="footerInfoModal" hidden>
    <div class="lead-modal-backdrop" data-footer-close></div>
    <div class="lead-modal-card" role="dialog" aria-modal="true" aria-labelledby="footerInfoTitle">
      <button type="button" class="lead-modal-x" data-footer-close aria-label="بستن">×</button>
      <div class="lead-modal-ornament" aria-hidden="true"></div>
      <h3 id="footerInfoTitle"></h3>
      <p class="lead-modal-body" id="footerInfoBody"></p>
      <button type="button" class="lead-modal-close-btn" data-footer-close>بستن</button>
    </div>
  </div>

  <script type="module">
    import { renderPage, fontStack, toFaDigits } from "/site-render.js";
    import { bindAllInteractions } from "/interactive.js";
    import { bindAnalytics } from "/analytics.js";

    function escText(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function faText(str) {
      return escText(toFaDigits(str));
    }

    function toLatinDigits(str) {
      return String(str ?? "")
        .replace(/[۰-۹]/g, (d) => String("۰۱۲۳۴۵۶۷۸۹".indexOf(d)))
        .replace(/[٠-٩]/g, (d) => String("٠١٢٣٤٥٦٧٨٩".indexOf(d)));
    }

    function defaultNavItems(site = {}) {
      return [
        { label: "مقالات", href: "/blog", font: "Graphik Arabic", size: 14, color: "#f7f0e3", variant: "link" },
        { label: "پوسترها", href: "#posters-1", font: "Graphik Arabic", size: 14, color: "#f7f0e3", variant: "link" },
        {
          label: (site.loginLabel || "ورود").trim() || "ورود",
          href: (site.loginUrl || "").trim() || "#",
          font: "Graphik Arabic",
          size: 13,
          color: "#2ec4b6",
          variant: "login",
        },
        { label: "اعلام آمادگی", href: "#register-1", font: "Graphik Arabic", size: 13, color: "#062a32", variant: "cta" },
      ];
    }

    function renderHeaderNav(site = {}) {
      const nav = document.getElementById("siteNav");
      if (!nav) return;
      const items = Array.isArray(site.navItems) && site.navItems.length
        ? site.navItems
        : defaultNavItems(site);
      nav.innerHTML = items
        .map((item) => {
          const label = String(item.label || "").trim();
          if (!label) return "";
          const href = String(item.href || "").trim() || "#";
          const variant = item.variant || "link";
          const font = fontStack(item.font || site.defaultFont || "Graphik Arabic");
          const size = Math.max(10, Math.min(28, Number(item.size) || 14));
          const color = String(item.color || "#f7f0e3");
          const style = `--nav-font:${font};--nav-size:${size}px;--nav-color:${escText(color)}`;
          const external = /^https?:\/\//i.test(href);
          const target = external ? ` target="_blank" rel="noopener"` : "";
          if (variant === "login") {
            return `<a class="nav-login btn-magnetic" data-track="login" href="${escText(href)}" style="${style}"${target}><span>${faText(label)}</span></a>`;
          }
          if (variant === "cta") {
            return `<a class="nav-cta btn-magnetic" data-track="register" href="${escText(href)}" style="${style}"${target}><span>${faText(label)}</span></a>`;
          }
          const track = /\/blog/i.test(href) ? ` data-track="blog"` : ` data-track="nav"`;
          return `<a class="nav-link"${track} href="${escText(href)}" style="${style}"${target}>${faText(label)}</a>`;
        })
        .join("");
    }

    function defaultFooter() {
      return {
        brand: "سورناگلد",
        tagline: "معاملات طلای آبشده · با اعتبار سایناگلد",
        address: "",
        phone: "",
        infos: [],
      };
    }

    function normalizeFooter(raw = {}) {
      const base = defaultFooter();
      const infos = Array.isArray(raw.infos)
        ? raw.infos
            .map((item, i) => ({
              id: String(item?.id || `info-${i}`),
              label: String(item?.label || "").trim(),
              title: String(item?.title || item?.label || "").trim(),
              body: String(item?.body || "").trim(),
            }))
            .filter((item) => item.label)
        : [];
      return {
        brand: String(raw.brand || base.brand).trim() || base.brand,
        tagline: String(raw.tagline ?? base.tagline).trim(),
        address: String(raw.address || "").trim(),
        phone: String(raw.phone || "").trim(),
        infos,
      };
    }

    function phoneHref(phone) {
      const digits = toLatinDigits(phone).replace(/[^\d+]/g, "");
      return digits ? `tel:${digits}` : "#";
    }

    function renderFooter(site = {}) {
      const box = document.getElementById("siteFooter");
      if (!box) return;
      const footer = normalizeFooter(site.footer || {});
      const contactBits = [];
      if (footer.address) {
        contactBits.push(`<div class="row-line"><span class="k">آدرس</span><span>${faText(footer.address)}</span></div>`);
      }
      if (footer.phone) {
        contactBits.push(
          `<div class="row-line"><span class="k">تماس</span><a href="${escText(phoneHref(footer.phone))}" dir="ltr">${faText(footer.phone)}</a></div>`
        );
      }
      const infoBtns = footer.infos
        .map(
          (item) =>
            `<button type="button" data-footer-info="${escText(item.id)}">${faText(item.label)}</button>`
        )
        .join("");

      box.innerHTML = `
        <div>
          <p class="name">${faText(footer.brand)}</p>
          ${footer.tagline ? `<p class="meta">${faText(footer.tagline)}</p>` : ""}
          ${contactBits.length ? `<div class="contact">${contactBits.join("")}</div>` : ""}
        </div>
        ${infoBtns ? `<div class="info-links">${infoBtns}</div>` : ""}
      `;

      box.querySelectorAll("[data-footer-info]").forEach((btn) => {
        btn.addEventListener("click", () => openFooterInfo(footer.infos.find((x) => x.id === btn.dataset.footerInfo)));
      });
    }

    function openFooterInfo(item) {
      if (!item) return;
      const modal = document.getElementById("footerInfoModal");
      if (!modal) return;
      document.getElementById("footerInfoTitle").textContent = toFaDigits(item.title || item.label);
      document.getElementById("footerInfoBody").textContent = toFaDigits(item.body || "");
      modal.hidden = false;
      document.body.style.overflow = "hidden";
    }

    function closeFooterInfo() {
      const modal = document.getElementById("footerInfoModal");
      if (!modal) return;
      modal.hidden = true;
      document.body.style.overflow = "";
    }

    function applySiteChrome(site = {}) {
      const stack = fontStack(site.defaultFont || "Graphik Arabic");
      document.documentElement.style.setProperty("--font", stack);
      document.body.style.fontFamily = stack;
      renderHeaderNav(site);
      renderFooter(site);

      const track = document.getElementById("tickerTrack");
      if (track) {
        const raw = Array.isArray(site.tickerItems) && site.tickerItems.length
          ? site.tickerItems
          : [{ text: "سورناگلد · معاملات طلای آبشده", color: "#e2b657" }];
        const items = raw.map((t) =>
          typeof t === "string"
            ? { text: t, color: "#f7f0e3" }
            : { text: t?.text || "", color: t?.color || "#f7f0e3" }
        ).filter((t) => t.text);
        track.innerHTML = items
          .map((t) => `<span style="--tick-color:${escText(t.color)}">${faText(t.text)}</span>`)
          .join("");
        const speed = Math.max(1, Math.min(10, Math.round(Number(site.tickerSpeed) || 5)));
        track.dataset.tickerSpeed = String(speed);
        track.dataset.looped = "";
      }
    }

    function applySeo(site = {}) {
      const seo = site.seo || {};
      if (seo.title) document.title = seo.title;
      const setMeta = (attr, key, value) => {
        if (!value) return;
        let el = document.head.querySelector(`meta[${attr}="${key}"]`);
        if (!el) {
          el = document.createElement("meta");
          el.setAttribute(attr, key);
          document.head.appendChild(el);
        }
        el.setAttribute("content", value);
      };
      setMeta("name", "description", seo.description);
      setMeta("name", "keywords", seo.keywords);
      setMeta("property", "og:title", seo.title);
      setMeta("property", "og:description", seo.description);
      if (seo.ogImage) setMeta("property", "og:image", seo.ogImage);
      if (seo.canonicalUrl) {
        let link = document.head.querySelector('link[rel="canonical"]');
        if (!link) {
          link = document.createElement("link");
          link.rel = "canonical";
          document.head.appendChild(link);
        }
        link.href = seo.canonicalUrl;
      }
    }

    async function boot() {
      const res = await fetch("/api/content");
      const content = await res.json();
      applySiteChrome(content.site || {});
      applySeo(content.site || {});
      document.getElementById("page-sections").innerHTML = renderPage(content);
      bindAllInteractions();
      bindAnalytics();
      const docRequired = new Set(["shopkeeper", "melt_seller", "wholesaler"]);
      function openLeadModal(modal) {
        if (!modal) return;
        modal.hidden = false;
        document.body.style.overflow = "hidden";
        modal.querySelector(".lead-modal-link")?.focus();
      }
      function closeLeadModal(modal) {
        if (!modal) return;
        modal.hidden = true;
        document.body.style.overflow = "";
      }

      document.querySelectorAll(".lead-form").forEach((form) => {
        const interest = form.querySelector("[data-interest]");
        const docField = form.querySelector("[data-doc-field]");
        const otherField = form.querySelector("[data-other-field]");
        const docInput = docField?.querySelector('input[type="file"]');
        const otherInput = otherField?.querySelector('input[name="otherDetail"], textarea[name="otherDetail"]');
        const modalId = form.dataset.successModal || "leadSuccessModal";
        const modal = document.getElementById(modalId);

        const syncInterestFields = () => {
          const value = interest?.value || "";
          const needsDoc = docRequired.has(value);
          const needsOther = value === "other";
          docField?.classList.toggle("is-hidden", !needsDoc);
          otherField?.classList.toggle("is-hidden", !needsOther);
          if (docInput) {
            docInput.required = needsDoc;
            if (!needsDoc) docInput.value = "";
          }
          if (otherInput) {
            otherInput.required = needsOther;
            if (!needsOther) otherInput.value = "";
          }
        };
        interest?.addEventListener("change", syncInterestFields);
        syncInterestFields();

        modal?.querySelectorAll("[data-modal-close]").forEach((el) => {
          el.addEventListener("click", () => closeLeadModal(modal));
        });
        document.addEventListener("keydown", (ev) => {
          if (ev.key === "Escape" && modal && !modal.hidden) closeLeadModal(modal);
        });

        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const value = interest?.value || "";
          if (docRequired.has(value) && (!docInput?.files || !docInput.files[0])) {
            alert("برای این نوع فعالیت، آپلود عکس جواز کسب یا کارت ویزیت الزامی است.");
            return;
          }
          if (value === "other" && !(otherInput?.value || "").trim()) {
            alert("برای گزینه «سایر» نوشتن توضیح الزامی است.");
            return;
          }
          const fd = new FormData(form);
          const phoneRaw = fd.get("phone");
          if (phoneRaw != null) fd.set("phone", toLatinDigits(phoneRaw));
          const r = await fetch("/api/leads", { method: "POST", body: fd });
          if (r.ok) {
            form.reset();
            syncInterestFields();
            openLeadModal(modal);
          } else {
            let err = "خطا در ثبت";
            try { err = (await r.json()).error || err; } catch {}
            alert(err);
          }
        });
      });

      const footerModal = document.getElementById("footerInfoModal");
      footerModal?.querySelectorAll("[data-footer-close]").forEach((el) => {
        el.addEventListener("click", closeFooterInfo);
      });
      document.addEventListener("keydown", (ev) => {
        if (ev.key === "Escape" && footerModal && !footerModal.hidden) closeFooterInfo();
      });
    }
    boot();
  </script>
</body>
</html>
